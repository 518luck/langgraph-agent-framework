# 基础服务编排：一条 `docker compose up -d` 启动本项目依赖的 5 个服务
# 启动步骤、服务地址与排障见同目录 README.md
#
# 下文两种映射的方向统一是「左 = 宿主机，右 = 容器」：
#   "15432:5432"   端口映射，左边是本机访问时用的端口
#   ./postgres:xxx 目录挂载，左边是项目里的真实目录
#
# 所有服务都不写死 container_name：compose 按「项目名-服务名-序号」自动命名，
# 本模板复制到多个项目同时启动也不会撞名（隔离靠上面的 name 换名）。

# compose 项目名，决定 Docker Desktop 里的分组名；换成自己项目的名字
name: agent-framework

services:
  # PostgreSQL：示例数据库，示例链路从这里取数据
  postgres:
    image: postgres:17
    restart: unless-stopped                     # 异常退出自动拉起，手动停的不拉
    environment:
      # 密码需与 conf/app_config.yaml 的 db 保持一致
      POSTGRES_PASSWORD: "12345678"
      POSTGRES_DB: app                          # 首次启动自动建库，无需建库脚本
    ports:
      # 本机 15432 → 容器 5432，换端口是为了避让本机或其他项目占用的 5432
      - "15432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data  # 数据持久化，删容器不丢数据
      - ./postgres:/docker-entrypoint-initdb.d  # 首次启动自动执行其中的建表脚本

  # Elasticsearch：给需要精确匹配的文本建倒排索引（可选，用不到可删掉本服务）
  elasticsearch:
    build: ./elasticsearch                      # 官方镜像不含 IK 中文分词器，需自行构建
    restart: unless-stopped
    environment:
      discovery.type: single-node               # 单节点模式，省去集群配置
      xpack.security.enabled: "false"           # 关闭认证，只适合本地开发
    ports:
      - "9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data

  # Kibana：ES 的可视化调试界面，开发期用来看索引、试查询
  kibana:
    image: kibana:8.19.10                       # 版本必须与 ES 一致
    restart: unless-stopped
    environment:
      # 容器之间靠服务名互访，这里写的是上面的服务名 elasticsearch，
      # 不能写 localhost —— 容器里的 localhost 指向容器自己
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    ports:
      - "5601:5601"
    depends_on:
      - elasticsearch                           # 只保证启动顺序，不等待 ES 就绪

  # Qdrant：向量库，支撑语义检索（可选，用不到可删掉本服务）
  qdrant:
    image: qdrant/qdrant:v1.16
    restart: unless-stopped
    ports:
      - "6333:6333" # HTTP，客户端与 dashboard 都走这个
      - "6334:6334" # gRPC，当前项目用不到，先开出来备用
    volumes:
      - qdrant_data:/qdrant/storage

  # Embedding 推理服务：把文本转成向量，为向量库提供向量来源（可选）
  embedding:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.8
    platform: linux/amd64                       # TEI 的 CPU 镜像只有 amd64，Mac M 系靠模拟运行
    restart: unless-stopped
    ports:
      - "8081:80"                               # 容器内监听 80，映射到本机 8081
    environment:
      MODEL_ID: /models/bge-large-zh-v1.5       # 指向下面挂载进来的模型目录
      MAX_CONCURRENT_REQUESTS: "16"             # 同时处理的最大请求数，默认 512，本地调小
      MAX_BATCH_TOKENS: "16384"                 # 单批 token 总量上限，影响吞吐
    volumes:
      - ./embedding/bge-large-zh-v1.5:/models/bge-large-zh-v1.5

# 命名卷由 Docker 管理，不在项目目录里。作用是把数据从容器生命周期中独立出来：
# 删容器不删卷，数据就还在。反之 `docker compose down -v` 会连卷一起删，
# PostgreSQL / ES / Qdrant 的数据都会丢。
volumes:
  postgres_data:
  es_data:
  qdrant_data:
