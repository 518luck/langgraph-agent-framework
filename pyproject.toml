[project]
name = "langgraph-agent-framework"
version = "0.1.0"
description = "FastAPI + LangGraph 智能体后端框架：SSE 流式接口、分层仓储与可观测的节点编排"
readme = "README.md"
authors = [
  { name = "518luck", email = "165388484+518luck@users.noreply.github.com" },
]
requires-python = ">=3.14"
dependencies = [
  "asyncmy>=0.2.11",              # MySQL 的高性能 asyncio 驱动，配合 SQLAlchemy 实现全异步数据库访问
  "cryptography>=46.0.7",         # 加密与证书基础库，也是很多网络、数据库和安全相关依赖的底层基础
  "elasticsearch[async]>=8,<9",   # 异步 Elasticsearch 客户端，用于全文检索
  "fastapi[standard]>=0.135.3",   # 高性能异步 Web 框架，作为整个服务的 API 入口
  "greenlet>=3.4.0",              # SQLAlchemy 等异步/同步协作场景中的底层协程支持库
  "huggingface-hub>=1.10.1",      # 用于模型下载以及 HuggingFace 生态接入
  "jieba>=0.42.1",                # 中文分词与关键词提取工具
  "langchain>=1.2.15",            # LLM 应用编排框架，用于构建 RAG、工具调用和 Prompt 链路
  "langchain-huggingface>=1.2.1", # LangChain 与 HuggingFace 模型的桥接层，主要用于 Embedding 或模型加载
  "langchain-openai>=1.6.6",      # llm.py 用 OpenAI 兼容协议接模型（换服务商只改配置里的 base_url）
  "langgraph>=1.1.6",             # 用图结构构建可控的 Agent 流程
  "loguru>=0.7.3",                # 更简洁的日志库，适合工程化项目统一管理日志输出
  "omegaconf>=2.3.0",             # 分层配置管理工具，适合多环境、多模型、多参数场景
  "python-dotenv>=1.2.2",         # 从 .env 文件读取环境变量，避免把密钥写死在代码中
  "pyyaml>=6.0.3",                # 用于 YAML 文件的读取与写入
  "qdrant-client>=1.17.1",        # 向量数据库客户端，用于 Embedding 向量存储与相似度检索
  "sqlalchemy>=2.0.49",           # Python 常用 ORM，用统一模型管理数据库读写与事务
]

[tool.uv]
# 这是应用不是库：不需要把自己装进环境，也就不需要 src 布局与构建后端
package = false

[tool.pyright]
# 让 pyright 使用项目 .venv 的解释器找依赖；uvx 临时环境里没有本项目包，
# 不配的话所有第三方 import 都会被误报 reportMissingImports
venvPath = "."
venv = ".venv"
